[build-system]
requires = ["setuptools>=79.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoarray"
dynamic = ["version"]
  description="PyAuto Data Structures"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "James Nightingale", email = "James.Nightingale@newcastle.ac.uk" },
    { name = "Richard Hayes", email = "richard@rghsoftware.co.uk" },
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]
keywords = ["cli"]
dependencies = [
    "autonerves",
    "astropy>=5.0,<=7.2.0",
    "decorator>=4.0.0",
    "dill>=0.3.1.1",
    "matplotlib>=3.7.0",
    "scipy<=1.17.1",
    "scikit-image<=0.26.0",
    "scikit-learn<=1.8.0",
    "tqdm"
]

[project.urls]
Homepage = "https://github.com/PyAutoLabs/PyAutoArray"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["docs", "test_autoarray", "test_autoarray*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"


[project.optional-dependencies]
jax = ["autonerves[jax]"]
optional = [
    "autoarray[jax]",
    "numba",
    "nufftax>=0.4.0,<0.5.0; python_version >= '3.12'",
    "pynufft",
    # tfp provides the modified-Bessel `bessel_kve` used by the JAX Matern-kernel
    # regularization path (autoarray/inversion/regularization/matern_kernel.py).
    # The last *stable* release (tensorflow-probability==0.25.0) targets a JAX where
    # `jax.interpreters.xla.pytype_aval_mappings` still existed; it crashes at import
    # under the resolved `jax>=0.7` stack (autonerves[jax]). The nightly restores
    # compatibility. Durable fix (vendor bessel_kve, drop tfp) tracked separately.
    "tfp-nightly==0.26.0.dev20260713"
]
test = ["pytest"]
dev = ["pytest", "black", "numba", "nufftax>=0.4.0,<0.5.0; python_version >= '3.12'", "pynufft==2022.2.2"]

[tool.pytest.ini_options]
testpaths = ["test_autoarray"]
filterwarnings = [
    "ignore:cuda_plugin_extension:UserWarning",
    "ignore::DeprecationWarning:jax",
]